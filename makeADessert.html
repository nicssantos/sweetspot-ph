<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | sweetspot.ph</title>
    <link rel="icon" href="img/icon2.png" type="image/png" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/makeADessert.css" />
    <script src="js/main.js" defer></script>
    <script src="js/makeADessert.js" defer></script>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="home.html"><img src="img/icon.png" /></a>
      </div>

      <!-- Hamburger Icon -->
      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">HOME</a></li>
        <li><a href="desserts.html">DESSERTS</a></li>
        <li><a href="shopFinder.html">SHOP FINDER</a></li>
        <li><a href="makeADessert.html" class="active">MAKE-A-DESSERT</a></li>
        <li><a href="about.html">ABOUT</a></li>
      </ul>
    </nav>

    <div class="main">
      <div class="content">
        <h2>Make-a-Dessert</h2>
        <p>Create your own Filipino treat - we'll guide you!</p>
        <div class="selection-wrapper">
          <h4>Choose your dessert:</h4>
          <ul class="desserts-grid">
            <li class="dessert-item">
              <img src="../img/mad/halo-halo.png" alt="Halo-Halo" class="dessert-image" />
              <button class="dessert-btn" onclick="selectDessert('halo-halo')">
                Halo-Halo
              </button>
            </li>
            <li class="dessert-item">
              <img
                src="../img/mad/saging-con-yelo.png"
                alt="Saging con Yelo"
                class="dessert-image"
              />
              <button
                class="dessert-btn"
                onclick="selectDessert('saging-con-yelo')"
              >
                Saging con Yelo
              </button>
            </li>
            <li class="dessert-item">
              <img
                src="../img/mad/mais-con-yelo.png"
                alt="Mais con Yelo"
                class="dessert-image"
              />
              <button
                class="dessert-btn"
                onclick="selectDessert('mais-con-yelo')"
              >
                Mais con Yelo
              </button>
            </li>
          </ul>
        </div>
      </div>
      <button class="menu-btn" style="display: none">
        <img src="../img/left-arrow.svg" alt="Left arrow" />Menu
      </button>
      <div class="grid" style="display: none">
        <div class="panel-one"></div>
        <div class="panel-two"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-left">
          <img src="img/icon.png" alt="Sweetspot Logo" />
          <p>
            sweetspot.ph — celebrating Filipino desserts, one bite at a time.
          </p>
        </div>
        <div class="footer-bottom">
          <p>© 2025 sweetspot.ph | All Rights Reserved</p>
        </div>
      </div>
    </footer>
  </body>
</html>
