<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Finder | sweetspot.ph</title>
    <link rel="icon" href="img/icon2.png" type="image/png" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/shopFinder.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="home.html"><img src="img/icon.png" /></a>
      </div>

      <!-- Hamburger Icon -->
      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">HOME</a></li>
        <li><a href="desserts.html">DESSERTS</a></li>
        <li><a href="shopFinder.html" class="active">SHOP FINDER</a></li>
        <li><a href="makeADessert.html">MAKE-A-DESSERT</a></li>
        <li><a href="about.html">ABOUT</a></li>
      </ul>
    </nav>

    <div class="main">
      <button onclick="backToTop()" id="topBtn" title="Go to top">
        <img
          src="https://www.svgrepo.com/show/500715/top.svg"
          alt="Upward arrow"
          width="25px"
          height="auto"
        />
      </button>
      <div class="heading">
        <div class="heading-overlay"></div>
        <h1>Nearest Shop Finder</h1>
        <p>
          Search for your city or use your location to find the nearest shop to
          you
        </p>
      </div>

      <div class="video-background">
        <video autoplay muted loop playsinline>
          <source src="../vid/shop-finder-bg.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="container">
        <div class="wrapper">
          <h5>Find shops near you..</h5>
          <div class="search-bar">
            <img
              src="https://www.svgrepo.com/show/520923/search.svg"
              alt="Search icon"
              width="30px"
              height="auto"
            />
            <input
              type="text"
              id="citySearch"
              list="cityOptions"
              placeholder="Search your city"
            />
            <datalist id="cityOptions">
              <option value="Ras al Khaimah"></option>
              <option value="Dubai"></option>
              <option value="Manila"></option>
              <option value="Laguna"></option>
              <option value="Cavite"></option>
            </datalist>
          </div>
          <div id="location-btn">
            <button class="location-btn">Use Your Location</button>
          </div>
          <div
            id="location-status"
            class="location-status"
            style="display: none"
            ;
          ></div>
          <div class="shop-list" id="shopList"></div>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-left">
          <img src="img/icon.png" alt="Sweetspot Logo" />
          <p>
            sweetspot.ph — celebrating Filipino desserts, one bite at a time.
          </p>
        </div>
        <div class="footer-bottom">
          <p>© 2025 sweetspot.ph | All Rights Reserved</p>
        </div>
      </div>
    </footer>

    <script src="js/main.js" defer></script>
    <script src="js/shopFinder.js"></script>
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6sZScKExRC3XCnQLqsQuqOO0iQDM6Mqc&callback=initMap"
    ></script>
  </body>
</html>
